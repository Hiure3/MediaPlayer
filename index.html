<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MPC-HC Audio/Video Player</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background-color: #121212;
      color: #e0e0e0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      font-size: 12px;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    .menu-bar {
      background: #1e1e1e;
      border-bottom: 1px solid #2a2a2a;
      display: flex;
      padding: 2px 8px;
      gap: 15px;
      font-size: 11px;
    }
    .menu-item { cursor: pointer; padding: 2px 5px; color: #ccc; }
    .menu-item:hover { background: #333; color: #fff; border-radius: 2px; }

    .main-container {
      display: flex;
      flex: 1;
      background: #000;
      overflow: hidden;
    }
    .video-container {
      flex: 1;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
    }
    video { width: 100%; height: 100%; object-fit: contain; }

    .side-panel {
      width: 150px;
      background: #181818;
      border-left: 1px solid #2d2d2d;
      display: flex;
      flex-direction: column;
      padding: 10px;
      gap: 10px;
    }
    .panel-title {
      font-weight: bold;
      color: #888;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      text-align: center;
      border-bottom: 1px solid #2a2a2a;
      padding-bottom: 4px;
    }
    .vu-meter-container {
      display: flex;
      flex: 1;
      justify-content: space-around;
      align-items: flex-end;
      background: #0a0a0a;
      border: 1px solid #333;
      padding: 8px 4px;
      border-radius: 3px;
    }
    .vu-channel {
      width: 22px;
      height: 100%;
      background: #151515;
      display: flex;
      flex-direction: column-reverse;
      border-radius: 2px;
      overflow: hidden;
      border: 1px solid #222;
    }
    .vu-fill {
      width: 100%;
      height: 0%;
      background: linear-gradient(to top, #00e676 0%, #00e676 70%, #ffeb3b 85%, #ff1744 100%);
      transition: height 0.05s ease-out;
    }
    .vu-label {
      text-align: center;
      font-size: 9px;
      color: #666;
      margin-top: 4px;
    }
    .side-control {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .side-control label { font-size: 10px; color: #aaa; }
    input[type=range] { width: 100%; accent-color: #00e676; }

    .controls-bar {
      background: #181818;
      border-top: 1px solid #2d2d2d;
      padding: 8px 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .seek-bar-container { display: flex; align-items: center; gap: 8px; }
    .time-display { font-family: monospace; font-size: 11px; color: #aaa; width: 60px; text-align: center; }
    .buttons-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .btn-group { display: flex; align-items: center; gap: 6px; }
    button {
      background: #282828;
      border: 1px solid #3a3a3a;
      color: #e0e0e0;
      padding: 4px 10px;
      border-radius: 3px;
      cursor: pointer;
      font-size: 11px;
    }
    button:hover { background: #383838; border-color: #555; }
    button:active { background: #1f1f1f; }
    .file-input { display: none; }
  </style>
</head>
<body>
  <div class="menu-bar">
    <div class="menu-item" onclick="document.getElementById('fileInput').click()">Arquivo</div>
    <div class="menu-item">Exibir</div>
    <div class="menu-item">Navegação</div>
    <div class="menu-item">Favoritos</div>
    <div class="menu-item">Ajuda</div>
  </div>

  <div class="main-container">
    <div class="video-container">
      <video id="mediaPlayer" crossorigin="anonymous"></video>
    </div>
    <div class="side-panel">
      <div class="panel-title">Nível de Áudio</div>
      <div class="vu-meter-container">
        <div style="display:flex; flex-direction:column; align-items:center; height:100%;">
          <div class="vu-channel"><div id="vuLeft" class="vu-fill"></div></div>
          <div class="vu-label">L</div>
        </div>
        <div style="display:flex; flex-direction:column; align-items:center; height:100%;">
          <div class="vu-channel"><div id="vuRight" class="vu-fill"></div></div>
          <div class="vu-label">R</div>
        </div>
      </div>
      <div class="side-control">
        <label for="volSlider">Volume Principal</label>
        <input type="range" id="volSlider" min="0" max="1" step="0.01" value="0.8">
      </div>
    </div>
  </div>

  <div class="controls-bar">
    <div class="seek-bar-container">
      <span id="currentTime" class="time-display">00:00</span>
      <input type="range" id="seekBar" min="0" max="100" value="0" style="flex:1;">
      <span id="durationTime" class="time-display">00:00</span>
    </div>
    <div class="buttons-row">
      <div class="btn-group">
        <button id="playBtn">▶ Play</button>
        <button id="pauseBtn">⏸ Pausa</button>
        <button id="stopBtn">⏹ Parar</button>
        <button onclick="document.getElementById('fileInput').click()">📂 Abrir Arquivo</button>
        <input type="file" id="fileInput" class="file-input" accept="audio/*,video/*">
      </div>
    </div>
  </div>

  <script>
    const media = document.getElementById('mediaPlayer');
    const playBtn = document.getElementById('playBtn');
    const pauseBtn = document.getElementById('pauseBtn');
    const stopBtn = document.getElementById('stopBtn');
    const fileInput = document.getElementById('fileInput');
    const volSlider = document.getElementById('volSlider');
    const seekBar = document.getElementById('seekBar');
    const currentTimeEl = document.getElementById('currentTime');
    const durationTimeEl = document.getElementById('durationTime');
    const vuLeft = document.getElementById('vuLeft');
    const vuRight = document.getElementById('vuRight');

    let audioCtx, source, splitter, analyserL, analyserR;

    function initAudio() {
      if (audioCtx) return;
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      source = audioCtx.createMediaElementSource(media);
      splitter = audioCtx.createChannelSplitter(2);
      analyserL = audioCtx.createAnalyser();
      analyserR = audioCtx.createAnalyser();
      analyserL.fftSize = 256;
      analyserR.fftSize = 256;

      source.connect(splitter);
      splitter.connect(analyserL, 0);
      splitter.connect(analyserR, 1);
      source.connect(audioCtx.destination);

      updateVUMeter();
    }

    function updateVUMeter() {
      if (!analyserL || !analyserR) return;
      const dataL = new Uint8Array(analyserL.frequencyBinCount);
      const dataR = new Uint8Array(analyserR.frequencyBinCount);

      analyserL.getByteFrequencyData(dataL);
      analyserR.getByteFrequencyData(dataR);

      const avgL = dataL.reduce((a, b) => a + b, 0) / dataL.length;
      const avgR = dataR.reduce((a, b) => a + b, 0) / dataR.length;

      vuLeft.style.height = Math.min(100, (avgL / 128) * 100) + '%';
      vuRight.style.height = Math.min(100, (avgR / 128) * 100) + '%';

      requestAnimationFrame(updateVUMeter);
    }

    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        media.src = URL.createObjectURL(file);
        media.play();
        initAudio();
        if (audioCtx.state === 'suspended') audioCtx.resume();
      }
    });

    playBtn.onclick = () => { media.play(); initAudio(); if(audioCtx) audioCtx.resume(); };
    pauseBtn.onclick = () => media.pause();
    stopBtn.onclick = () => { media.pause(); media.currentTime = 0; };

    volSlider.oninput = (e) => media.volume = e.target.value;

    media.ontimeupdate = () => {
      if (media.duration) {
        seekBar.value = (media.currentTime / media.duration) * 100;
        currentTimeEl.textContent = formatTime(media.currentTime);
        durationTimeEl.textContent = formatTime(media.duration);
      }
    };

    seekBar.oninput = (e) => {
      if (media.duration) {
        media.currentTime = (e.target.value / 100) * media.duration;
      }
    };

    function formatTime(s) {
      const mins = Math.floor(s / 60);
      const secs = Math.floor(s % 60);
      return `${mins.toString().padStart(2,'0')}:${secs.toString().padStart(2,'0')}`;
    }
  </script>
</body>
</html>
